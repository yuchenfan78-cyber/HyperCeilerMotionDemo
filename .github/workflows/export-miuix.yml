name: Export MiuiX Dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Resolve MiuiX dependencies
        env:
          MIUIX_USER: ${{ github.actor }}
          MIUIX_TOKEN: ${{ secrets.MIUIX_PAT || github.token }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Export cached Maven files
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          base = Path(os.environ.get('GRADLE_USER_HOME', str(Path.home() / '.gradle')))
          cache = base / 'caches/modules-2/files-2.1/fan.miuix'
          out = Path('miuix-offline-repo/fan/miuix')
          count = 0
          if not cache.is_dir():
              raise SystemExit(f'MiuiX Gradle cache not found: {cache}')
          for component in cache.iterdir():
              if not component.is_dir():
                  continue
              for version in component.iterdir():
                  if not version.is_dir():
                      continue
                  for hashed in version.iterdir():
                      if not hashed.is_dir():
                          continue
                      for source in hashed.iterdir():
                          if source.is_file() and source.suffix in ('.pom', '.module', '.aar', '.jar'):
                              target = out / component.name / version.name / source.name
                              target.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(source, target)
                              count += 1
          if count == 0 or not list(out.rglob('*.aar')):
              raise SystemExit('No MiuiX AAR dependencies were found')
          print('Exported MiuiX artifacts:', count)
          print('AAR files:', len(list(out.rglob('*.aar'))))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rainkernel-miuix-offline
          path: miuix-offline-repo/
          retention-days: 7
          if-no-files-found: error
